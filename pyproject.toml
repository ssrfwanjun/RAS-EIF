[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ras-eif"
version = "0.1.0"
description = "Validated rate-equation tools for Rydberg-atom EIF modelling"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "ARC-Alkali-Rydberg-Calculator==3.10.2",
  "matplotlib>=3.8",
  "numpy>=1.24",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
ras-eif = "ras_eif.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.setuptools.packages.find]
where = ["src"]
